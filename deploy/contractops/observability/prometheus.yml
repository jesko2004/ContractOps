global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: contractops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["contract-api:8080"]
  - job_name: contractops-worker
    static_configs:
      - targets: ["contract-worker:9101"]
  - job_name: contractops-scheduler
    static_configs:
      - targets: ["obligation-scheduler:9102"]

name: ContractOps API

on:
  push:
    branches: [main]
    paths:
      - "services/contract-api/**"
      - "deploy/contractops/**"
      - ".github/workflows/contractops-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/contract-api/**"
      - "deploy/contractops/**"
      - ".github/workflows/contractops-api.yml"
  workflow_dispatch:

concurrency:
  group: contractops-api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, types, tests, and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contractops_test
          POSTGRES_USER: contractops_admin
          POSTGRES_PASSWORD: contractops-admin-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractops_admin -d contractops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRACTOPS_ENVIRONMENT: test
      CONTRACTOPS_MIGRATION_DATABASE_URL: postgresql://contractops_admin:contractops-admin-test@localhost:5432/contractops_test
      CONTRACTOPS_DATABASE_URL: postgresql://contractops_app:contractops-app-test@localhost:5432/contractops_test
      CONTRACTOPS_INTEGRATION_DATABASE_URL: postgresql://contractops_app:contractops-app-test@localhost:5432/contractops_test
      CONTRACTOPS_INTEGRATION_ADMIN_DATABASE_URL: postgresql://contractops_admin:contractops-admin-test@localhost:5432/contractops_test
      CONTRACTOPS_INTEGRATION_WORKER_DATABASE_URL: postgresql://contractops_worker:contractops-worker-test@localhost:5432/contractops_test
      CONTRACTOPS_INTEGRATION_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: services/contract-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/contract-api/pyproject.toml

      - name: Install ContractOps API
        run: |
          python -m pip install uv==0.11.29
          uv lock --check
          uv sync --frozen --extra dev --group build --no-install-project
          uv sync --frozen --extra dev --group build --no-build-isolation --no-editable
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Empty database migration verification
        run: python scripts/verify_migrations.py

      - name: Provision non-superuser runtime role
        run: python scripts/provision_ci_database.py

      - name: Lint, typecheck, unit, and integration tests
        run: python scripts/check.py

      - name: Validate test Compose
        working-directory: deploy/contractops
        run: docker compose -f docker-compose.test.yml config --quiet

      - name: Validate production preflight commands
        env:
          CONTRACTOPS_ENVIRONMENT: production
          CONTRACTOPS_ALLOWED_HOSTS: api.contractops.example
          CONTRACTOPS_DATABASE_URL: postgresql://app:runtime-password@db.example/contractops?sslmode=verify-full
          CONTRACTOPS_MIGRATION_DATABASE_URL: postgresql://admin:migration-password@db.example/contractops?sslmode=verify-full
          CONTRACTOPS_WORKER_DATABASE_URL: postgresql://worker:worker-password@db.example/contractops?sslmode=verify-full
          CONTRACTOPS_REDIS_URL: rediss://redis.example/0
          CONTRACTOPS_JWT_SECRET: ci-production-jwt-secret-with-at-least-32-characters
          CONTRACTOPS_OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.example/v1/traces
          CONTRACTOPS_OBJECT_STORE_ENDPOINT: https://objects.example
          CONTRACTOPS_OBJECT_STORE_ACCESS_KEY: ci-access-key
          CONTRACTOPS_OBJECT_STORE_SECRET_KEY: ci-object-secret-with-32-characters
          CONTRACTOPS_OBJECT_STORE_BUCKET: contractops-production
          CONTRACTOPS_OBJECT_STORE_SECURE: "true"
        run: |
          CONTRACTOPS_RUNTIME_ROLE=api contractops-preflight --role api
          CONTRACTOPS_RUNTIME_ROLE=event-worker contractops-preflight --role event-worker
          CONTRACTOPS_RUNTIME_ROLE=ingestion-worker contractops-preflight --role ingestion-worker
          CONTRACTOPS_RUNTIME_ROLE=scheduler contractops-preflight --role scheduler
          CONTRACTOPS_RUNTIME_ROLE=migration contractops-preflight --role migration

      - name: Validate production Compose
        working-directory: deploy/contractops
        env:
          CONTRACTOPS_IMAGE: registry.example/contractops-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CONTRACTOPS_ALLOWED_HOSTS: api.contractops.example
          CONTRACTOPS_DATABASE_URL: postgresql://app:runtime-password@db.example/contractops?sslmode=verify-full
          CONTRACTOPS_MIGRATION_DATABASE_URL: postgresql://admin:migration-password@db.example/contractops?sslmode=verify-full
          CONTRACTOPS_WORKER_DATABASE_URL: postgresql://worker:worker-password@db.example/contractops?sslmode=verify-full
          CONTRACTOPS_REDIS_URL: rediss://redis.example/0
          CONTRACTOPS_JWT_SECRET: ci-production-jwt-secret-with-at-least-32-characters
          CONTRACTOPS_OTEL_EXPORTER_OTLP_ENDPOINT: https://otel.example/v1/traces
          CONTRACTOPS_OBJECT_STORE_ENDPOINT: https://objects.example
          CONTRACTOPS_OBJECT_STORE_ACCESS_KEY: ci-access-key
          CONTRACTOPS_OBJECT_STORE_SECRET_KEY: ci-object-secret-with-32-characters
          CONTRACTOPS_OBJECT_STORE_BUCKET: contractops-production
        run: docker compose -f docker-compose.prod.yml config --quiet

  performance:
    name: M7 production-readiness evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: contractops_perf
          POSTGRES_USER: contractops_admin
          POSTGRES_PASSWORD: contractops-admin-perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contractops_admin -d contractops_perf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRACTOPS_ENVIRONMENT: performance
      CONTRACTOPS_MIGRATION_DATABASE_URL: postgresql://contractops_admin:contractops-admin-perf@localhost:5432/contractops_perf
      CONTRACTOPS_DATABASE_URL: postgresql://contractops_app:contractops-app-test@localhost:5432/contractops_perf
      CONTRACTOPS_INTEGRATION_DATABASE_URL: postgresql://contractops_app:contractops-app-test@localhost:5432/contractops_perf
      CONTRACTOPS_INTEGRATION_ADMIN_DATABASE_URL: postgresql://contractops_admin:contractops-admin-perf@localhost:5432/contractops_perf
      CONTRACTOPS_INTEGRATION_WORKER_DATABASE_URL: postgresql://contractops_worker:contractops-worker-test@localhost:5432/contractops_perf
      CONTRACTOPS_INTEGRATION_REDIS_URL: redis://localhost:6379/14
      CONTRACTOPS_REDIS_URL: redis://localhost:6379/15
      CONTRACTOPS_JWT_SECRET: contractops-ci-performance-secret
      CONTRACTOPS_JWT_ISSUER: contractops
      CONTRACTOPS_JWT_AUDIENCE: contractops-api
    defaults:
      run:
        working-directory: services/contract-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/contract-api/pyproject.toml

      - name: Install performance toolchain
        run: |
          python -m pip install uv==0.11.29
          uv lock --check
          uv sync --frozen --extra dev --extra performance --group build --no-install-project
          uv sync --frozen --extra dev --extra performance --group build --no-build-isolation --no-editable
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare performance database
        run: |
          python scripts/verify_migrations.py
          python scripts/provision_ci_database.py
          python scripts/seed_performance.py

      - name: Run deterministic M7 fault and correctness gates
        run: >-
          python -m pytest
          tests/test_m7_resilience_security.py
          tests/test_postgres_approval_workflow.py
          tests/test_postgres_reliable_events.py
          tests/test_postgres_obligation_scheduler.py

      - name: Start ContractOps API
        run: |
          python -m uvicorn contractops.main:app --host 127.0.0.1 --port 8080 > contractops-api.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/health/live", timeout=1):
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("ContractOps API did not become ready")
          PY

      - name: Run Locust baseline and enforce thresholds
        run: |
          mkdir -p artifacts
          locust -f performance/locustfile.py --headless --users 20 --spawn-rate 5 \
            --run-time 30s --host http://127.0.0.1:8080 --only-summary \
            --csv artifacts/contractops --html artifacts/contractops.html
          python scripts/generate_performance_report.py artifacts/contractops_stats.csv \
            --json-output artifacts/m7-evidence.json \
            --markdown-output artifacts/m7-evidence.md \
            --users 20 --duration-seconds 30 --min-qps 10 --max-p95-ms 1000 \
            --max-failure-rate 0.01

      - name: Add evidence to workflow summary
        if: always()
        run: |
          if [ -f artifacts/m7-evidence.md ]; then
            cat artifacts/m7-evidence.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload M7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contractops-m7-evidence
          path: |
            services/contract-api/artifacts/
            services/contract-api/contractops-api.log
          if-no-files-found: warn

  container:
    name: ContractOps locked container builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build and smoke-test runtime image
        run: |
          docker build --target runtime -t contractops-runtime:audit services/contract-api
          docker run --rm contractops-runtime:audit contractops-preflight --help
      - name: Build and exercise test image
        run: |
          docker build --target test -t contractops-test:audit services/contract-api
          docker run --rm contractops-test:audit python -m pytest \
            tests/test_lease_heartbeat.py tests/test_task_pagination.py \
            tests/test_audit_observability.py tests/test_preproduction_release.py

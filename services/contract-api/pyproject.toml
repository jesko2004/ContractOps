[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "contractops-api"
version = "0.5.0"
description = "Contract review, approval, and obligation management service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "minio>=7.2,<8",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-sdk>=1.31,<2",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "pypdf>=5.1,<6",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
contractops-ingestion-worker = "contractops.ingestion_worker:main"
contractops-worker = "contractops.worker:main"
contractops-scheduler = "contractops.scheduler:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
performance = [
  "locust>=2.39,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contractops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["contractops"]
strict = true
warn_unreachable = true
